# The evening "what's due tomorrow" push.
#
# This lives here rather than in vercel.json because Vercel's Hobby plan allows
# exactly two cron entries and both are already spoken for — the Canvas expiry
# sweep at 13:00 UTC and the weekly recap at 23:00 — and it refuses any schedule
# that fires more than once a day. This reminder wants an evening slot that is
# neither of those.
#
# GitHub Actions has no such limit and costs nothing on a public or private
# repo at this volume. `/api/cron` already authenticates with a bearer secret
# rather than a Vercel signature, so it needed no change to be callable here.
#
# Set the two repository secrets before this does anything:
#   CRON_SECRET  — the same value as the Vercel environment variable
#   APP_URL      — https://insight-study-sleep.vercel.app (or the real domain)

name: Reminders

on:
  schedule:
    # 21:30 UTC is 16:30 in Frisco during daylight saving — after school, early
    # enough that there is still an evening to act on it. GitHub runs scheduled
    # workflows late under load, which is fine for this and would not be for
    # anything that had to land on the hour.
    - cron: "30 21 * * 0-4"
  workflow_dispatch: {}

jobs:
  due-work:
    runs-on: ubuntu-latest
    steps:
      - name: Send the due-work reminder
        run: |
          code=$(curl -sS -o /tmp/out.json -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" \
            "$APP_URL/api/cron?job=due-work")
          cat /tmp/out.json
          echo
          # Fail loudly. A reminder that silently stops firing is worse than one
          # that was never built, because nobody finds out for a term.
          if [ "$code" != "200" ]; then
            echo "::error::cron returned $code"
            exit 1
          fi
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
